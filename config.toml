title = "warp-wiki"
description = "Документация, руководства и полезные заметки в одном месте."
base_url = "https://eb-lan.github.io/warp-wiki.github.io"
default_language = "ru"

[plugins]
processors = ["markdown"]

[markdown]
safe = false

[highlight]
enabled = true
mode = "server"
theme = "github-dark"

[search]
enabled = true
format = "fuse_json"
fields = ["title", "content", "description"]
filename = "search.json"
ui = true
split_by_heading = true

[sitemap]
enabled = true

[robots]
enabled = true

[feeds]
enabled = false

[pagination]
enabled = false
