<nav class="navigation" aria-label="Документация">
  <p class="nav-caption">НАЧАЛО РАБОТЫ</p>
  <a class="nav-link{% if page.url == '/' %} current{% endif %}" href="{{ base_url }}/"{% if page.url == '/' %} aria-current="page"{% endif %}><span class="nav-symbol" aria-hidden="true">⌂</span>Введение</a>
  {% for group in site.sections %}
    {% if group.url != '/' %}
    <p class="nav-caption">{{ group.title }}</p>
    {% for entry in group.pages %}
      <a class="nav-link{% if page.url == entry.url %} current{% endif %}" href="{{ base_url }}{{ entry.url }}"{% if page.url == entry.url %} aria-current="page"{% endif %}><span class="nav-symbol" aria-hidden="true">{% if group.title == 'Руководства' %}▤{% else %}◇{% endif %}</span>{{ entry.title }}</a>
    {% endfor %}
    {% endif %}
  {% endfor %}
  <div class="nav-external"><a href="https://github.com/eb-lan/warp-wiki.github.io"><span>Исходный код</span><span aria-hidden="true">↗</span></a><a href="https://github.com/eb-lan/warp-wiki.github.io/issues"><span>Предложить улучшение</span><span aria-hidden="true">↗</span></a></div>
</nav>
